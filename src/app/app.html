<h1>Hello, {{ title() }}</h1>
      <p>Congratulations! Your app is running. 🎉</p>

<p-table [value]="todos" [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10]"
    [tableStyle]="{'min-width': '60rem'}"
    styleClass="p-datatable-gridlines">
  <ng-template pTemplate="header">
        <tr>
          <th>User Id:</th>
          <th>Id:</th>
          <th>Title:</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-todos>
        <tr>
          <td>{{ todos.userId }}</td>
          <td>{{ todos.id }}</td>
          <td>{{ todos.title }}</td>
        </tr>
      </ng-template>

    </p-table>

<br /><br />
<router-outlet></router-outlet>
